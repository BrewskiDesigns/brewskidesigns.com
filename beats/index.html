<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BD BEATS</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; color: #fff; font-family: Helvetica, Arial, sans-serif; min-height: 100vh; }
  a { color: inherit; }

  .back {
    position: fixed; top: 18px; left: 22px; z-index: 10;
    font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
    opacity: .5; text-decoration: none; transition: opacity .2s ease;
  }
  .back:hover { opacity: 1; }

  .wrap {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 10vh 6vw; gap: 26px;
  }
  .logo { width: min(320px, 62vw); aspect-ratio: 1 / 1; }
  .logo img { width: 100%; display: block; }

  .tag { font-size: 13px; letter-spacing: .34em; text-transform: uppercase; opacity: .55; }
  .soon { margin-top: 4px; font-size: 12px; letter-spacing: .26em; text-transform: uppercase; opacity: .38; }

  @media (max-width: 600px) {
    .logo { width: 70vw; }
  }
</style>
</head>
<body>

  <a class="back" href="../">&larr; Brewski Designs</a>

  <main class="wrap">
    <div class="logo"><img src="bd-beats.png" alt="BD BEATS" /></div>
    <p class="tag">Beats by Brewski</p>
    <p class="soon">Coming soon</p>
  </main>

</body>
</html>
